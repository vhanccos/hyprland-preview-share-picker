name: Release

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-24.04
    container:
      image: archlinux/archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            gtk4 \
            gtk4-layer-shell \
            base-devel \
            git \
            rustup

      - name: Install Rust nightly
        run: |
          rustup default nightly

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build release binary
        run: cargo build --release

      - name: Generate schema
        run: ./target/release/hyprland-preview-share-picker schema > schema.json

      - name: Create release archive
        run: |
          mkdir -p release-artifacts
          cp target/release/hyprland-preview-share-picker release-artifacts/
          cp schema.json release-artifacts/
          cd release-artifacts
          tar czf ../hyprland-preview-share-picker-${{ github.ref_name }}-x86_64-linux.tar.gz \
            hyprland-preview-share-picker schema.json

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            hyprland-preview-share-picker-${{ github.ref_name }}-x86_64-linux.tar.gz
